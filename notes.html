<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LocalNotes — a simple and secure offline notes app and text editor right in your browser. Простой и безопасный офлайн-редактор заметок."/>
    <meta name="keywords" content="localnotes, offline notes, web notes app, markdown notes, заметки оффлайн, текстовый редактор, web app"/>
    <title>Local Notes - All Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="https://donatello.to/DUBIK?g=for-future-projects" target="_blank" class="donatele">Donate</a>
    <button id="theme-toggle" class="theme-btn">🌙</button>
    <a href="https://github.com/ONE-BIT116" target="_blank" class="github-btn">GitHub</a>
    <!-- Основной контейнер со списком -->
    <main class="container">
        <h1>Your Notes</h1>
        
        <!-- Сетка, куда JavaScript будет динамически выводить карточки -->
        <div id="notes-grid" class="notes-grid">
            <!-- Cards will be generated dynamically via JS -->
        </div>

        <!-- Кнопка создания заметки внизу страницы -->
        <div class="bottom-action">
            <a href="create.html" class="btn">Create Note</a>
        </div>
    </main>

    <!-- Внешний скрипт для отрисовки и логики -->
    <script src="script.js"></script>
</body>
</html>
