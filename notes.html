<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Notes - All Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Основной контейнер со списком -->
    <main class="container">
        <h1>Your Notes</h1>
        
        <!-- Сетка, куда JavaScript будет динамически выводить карточки -->
        <div id="notes-grid" class="notes-grid">
            <!-- Cards will be generated dynamically via JS -->
        </div>

        <!-- Кнопка создания заметки внизу страницы -->
        <div class="bottom-action">
            <a href="create.html" class="btn">Create Note</a>
        </div>
    </main>

    <!-- Внешний скрипт для отрисовки и логики -->
    <script src="script.js"></script>
</body>
</html>
